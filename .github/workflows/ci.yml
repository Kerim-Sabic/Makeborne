name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      - name: Offline check harnesses
        # Runs src/**/check-*.cjs except harnesses that need a server, browser,
        # database or MAKEBORNE_VERIFY_* opt-in (see scripts/run-checks.mjs).
        run: npm test

      - name: Build
        # No secrets: cloud, billing, previews and generation stay disabled.
        env:
          MAKEBORNE_CLOUD_ENABLED: "false"
          MAKEBORNE_CLOUD_MIGRATIONS_VERIFIED: "false"
          MAKEBORNE_PRIVATE_PREVIEWS_ENABLED: "false"
          WHOP_CREATION_ENABLED: "false"
        run: npm run build
